<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf8ee"><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/site.css?v=6"><script defer src="/assets/site.js?v=6"></script><title>Compare fonts · AWEFonts</title></head><body data-page="compare"><div id="header"></div><main><section class="heading"><small>06 / TYPEFACE LAB</small><h1>Compare <em>side by side.</em></h1><p>Compare up to four real font families using the same specimen, metadata and source details.</p><div class="compare-actions"><a class="btn dark" href="/fonts.html">Add more fonts ↗</a><button id="clearCompare" class="btn">Clear comparison</button></div></section><section class="content"><div id="compareGrid" class="compare-layout"><div class="compare-empty">Loading comparison…</div></div></section></main><div id="footer"></div><div id="toast" class="toast"></div><script>
document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('compareGrid'),key='awf-compare-v1';let ids=JSON.parse(localStorage.getItem(key)||'[]');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=async()=>{const r=await fetch('https://fonts.api.aweconnect.dpdns.org/v1/catalog.json');if(!r.ok)throw Error('catalog');const all=(await r.json()).fonts||[];const fonts=ids.map(id=>all.find(f=>f.id===id)).filter(Boolean);root.innerHTML=fonts.length?fonts.map(f=>{const href=f.source==='google'?'https://fonts.googleapis.com/css2?family='+encodeURIComponent(f.family).replace(/%20/g,'+')+'&display=swap':f.providerCss||'';if(href){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.append(l)}return '<article class="compare-card"><small>'+esc(f.sourceLabel||f.source)+'</small><h2>'+esc(f.family)+'</h2><div class="compare-specimen" style="font-family:'+JSON.stringify(f.family)+',sans-serif">Aa Bb Cc 0123<br>Աա Բբ Գգ</div><dl><dt>Category</dt><dd>'+esc(f.category)+'</dd><dt>Weights</dt><dd>'+esc((f.weights||[]).join(', ')||'Provider-defined')+'</dd><dt>Scripts</dt><dd>'+esc((f.subsets||f.languages||[]).join(', ')||'Not specified by provider')+'</dd><dt>License</dt><dd>'+esc(f.license||'See source terms')+'</dd><dt>Variable</dt><dd>'+((f.variable===true)?'Yes':(f.variable===false?'No':'Not specified'))+'</dd></dl><div class="compare-actions"><a class="btn" href="/font.html?id='+encodeURIComponent(f.id)+'">Details ↗</a><button class="btn" data-remove="'+esc(f.id)+'">Remove</button></div></article>'}).join(''):'<div class="compare-empty">No fonts selected yet. Open the font library and tap ⇄ on up to four font cards.</div>'};root.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;ids=ids.filter(x=>x!==b.dataset.remove);localStorage.setItem(key,JSON.stringify(ids));load()});document.getElementById('clearCompare').onclick=()=>{ids=[];localStorage.setItem(key,'[]');load()};try{await load()}catch(e){root.textContent='Could not load the catalog. Please try again.'}});</script></body></html>
