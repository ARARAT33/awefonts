name: Shard language coverage API payloads

on:
  push:
    branches:
      - feat/awefonts-world-library-2026
    paths:
      - "scripts/shard-language-coverage.py"
      - ".github/workflows/shard-language-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awefonts-language-data-sharding
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feat/awefonts-world-library-2026
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shard large language and glyph-coverage datasets
        run: python scripts/shard-language-coverage.py --root .
      - name: Validate indexes and shard mirrors
        run: node scripts/validate-static-site.mjs
      - name: Commit sharded static API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/language-registry.json api-site/v1/language-registry.json v1/language-registry api-site/v1/language-registry v1/language-cmap-coverage.json api-site/v1/language-cmap-coverage.json v1/language-cmap-coverage api-site/v1/language-cmap-coverage v1/health.json api-site/v1/health.json
          if ! git diff --cached --quiet; then
            git commit -m "data: shard language and glyph coverage static API [skip ci]"
            git fetch origin feat/awefonts-world-library-2026
            git rebase origin/feat/awefonts-world-library-2026
            git push origin HEAD:feat/awefonts-world-library-2026
          fi
